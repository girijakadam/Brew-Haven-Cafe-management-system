<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandatory Password Change | Brew Haven Cafe</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-cream); }
        h1, h2, h3, .brand { font-family: 'Playfair Display', serif; }
        .change-pwd-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            max-width: 480px;
            margin: 3rem auto;
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-icon">☕</span>
            <span>Brew Haven</span>
        </a>
        <div id="navAuth"></div>
    </nav>

    <main class="container">
        <div class="change-pwd-card">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <div style="font-size:3rem; margin-bottom:0.5rem;">🔐</div>
                <h2 style="color:var(--primary-dark); margin-bottom:0.4rem;">Set Your New Password</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">
                    An administrator has reset your password. You must set a new secure password before accessing cafe services.
                </p>
            </div>

            <div id="pwdAlertNotice" style="background:#fff3e0; border:1px solid #ffe0b2; color:#e65100; padding:0.8rem; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:1.2rem;">
                ⚠️ <strong>Mandatory Security Step:</strong> Please enter your temporary password and create a new password (min 6 characters).
            </div>

            <form id="changePasswordForm" onsubmit="event.preventDefault(); submitChangePassword();" autocomplete="on">
                <div class="form-group">
                    <label for="currentPassword">Current / Temporary Password *</label>
                    <input type="password" id="currentPassword" placeholder="Enter temporary password provided by admin" required autocomplete="current-password" />
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password *</label>
                    <input type="password" id="newPassword" placeholder="Minimum 6 characters" required autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password" />
                </div>
                <button type="submit" id="btnSubmitChange" class="btn-primary" style="width:100%; justify-content:center; padding:0.8rem; margin-top:0.8rem;">
                    Update Password & Access Cafe
                </button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; border-top:1px solid var(--border-color); padding-top:1rem;">
                <button class="btn-outline" style="font-size:0.85rem;" onclick="logout()">Log Out</button>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('bh_token');
            if (!token) {
                window.location.replace('index.html');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/auth/me`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const user = await res.json();
                    state.user = user;
                    state.token = token;
                    localStorage.setItem('bh_user', JSON.stringify(user));
                    updateAuthUI(user);
                    // If user already changed password, redirect to permitted dashboard
                    if (!user.mustChangePassword) {
                        window.location.replace(getPermittedDashboard(user.role));
                    }
                } else {
                    logout();
                }
            } catch (e) {
                console.error(e);
            }
        });

        async function submitChangePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!currentPassword) {
                showToast('Please enter your current temporary password', 'error');
                return;
            }
            if (!newPassword || newPassword.length < 6) {
                showToast('New password must be at least 6 characters', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('New password and confirm password do not match', 'error');
                return;
            }

            const btn = document.getElementById('btnSubmitChange');
            try {
                btn.disabled = true;
                const res = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
                });

                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';

                const data = await res.json();
                if (res.ok) {
                    state.token = data.token;
                    localStorage.setItem('bh_token', data.token);
                    state.user = { id: data.id, name: data.name, email: data.email, role: data.role, mustChangePassword: false };
                    localStorage.setItem('bh_user', JSON.stringify(state.user));
                    showToast('Password changed successfully! Welcome to Brew Haven.', 'success');
                    setTimeout(() => {
                        window.location.replace(getPermittedDashboard(data.role));
                    }, 1000);
                } else {
                    btn.disabled = false;
                    showToast(data.message || 'Failed to change password', 'error');
                }
            } catch (e) {
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                btn.disabled = false;
                showToast('Error: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
