<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Reviews | Brew Haven Cafe</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .brand { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-icon">☕</span>
            <span>Brew Haven</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Menu & Order</a></li>
            <li><a href="history.html" class="active">My Orders</a></li>
        </ul>
        <div id="navAuth"></div>
    </nav>

    <div class="container" style="max-width:850px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <div>
                <h2>My Orders History</h2>
                <p style="color:var(--text-muted); font-size:0.95rem;">Track live progress of your orders and review your past visits.</p>
            </div>
            <button class="btn-outline" onclick="loadMyOrders()">🔄 Refresh</button>
        </div>

        <div id="myOrdersList">
            <p style="text-align:center; padding:2rem; color:var(--text-muted);">Loading your orders...</p>
        </div>
    </div>

    <!-- Review Submission Modal -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content" style="max-width:480px;">
            <div class="modal-header">
                <h2>⭐ Review Your Dining Experience</h2>
                <button class="btn-close" onclick="closeModal('reviewModal')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="reviewOrderId" />
                <div class="form-group">
                    <label>Rating (1 to 5 Stars)</label>
                    <select id="reviewRating">
                        <option value="5">⭐⭐⭐⭐⭐ 5 - Exceptional Barista Craft!</option>
                        <option value="4">⭐⭐⭐⭐ 4 - Delicious & Pleasant</option>
                        <option value="3">⭐⭐⭐ 3 - Good</option>
                        <option value="2">⭐⭐ 2 - Could Be Better</option>
                        <option value="1">⭐ 1 - Unsatisfactory</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Feedback / Compliment</label>
                    <textarea id="reviewComment" rows="4" placeholder="How did you enjoy the brew, ambience, or pastry?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" onclick="closeModal('reviewModal')">Cancel</button>
                <button class="btn-primary" onclick="submitReview()">Submit Feedback</button>
            </div>
        </div>
    </div>

    <!-- Generic Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content" style="max-width:440px;">
            <div class="modal-header">
                <h2>Brew Haven Account</h2>
                <button class="btn-close" onclick="closeModal('authModal')">✕</button>
            </div>
            <div class="modal-body" id="authModalBody"></div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavigation();
            const token = localStorage.getItem('bh_token');
            if (token) {
                try {
                    const res = await fetch(`${API_BASE}/auth/me`, { headers: getAuthHeaders() });
                    if (res.ok) {
                        const u = await res.json();
                        state.user = u;
                        renderNavigation();
                        if (u.role === 'ROLE_ADMIN') {
                            showToast('Admin accounts access management portals', 'info');
                            window.location.replace('admin.html');
                            return;
                        } else if (u.role === 'ROLE_STAFF') {
                            showToast('Staff accounts access kitchen operations', 'info');
                            window.location.replace('staff.html');
                            return;
                        }
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            loadMyOrders();
        });
    </script>
</body>
</html>
