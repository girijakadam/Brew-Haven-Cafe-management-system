# Common Application Settings
spring.application.name=brew-haven-cafe
server.port=${SERVER_PORT:8080}

# Default profile is h2 for zero-config out-of-the-box run; set SPRING_PROFILES_ACTIVE=mysql for MySQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Jackson / JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Asia/Kolkata

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Integration Configuration (Gemini / Groq)
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Security & Initial Admin Provisioning Settings
app.security.seed-demo-users=${APP_SEED_DEMO_USERS:true}
app.security.initial-admin.email=${ADMIN_EMAIL:admin@brewhaven.com}
app.security.initial-admin.password=${ADMIN_PASSWORD:}
app.security.initial-admin.name=${ADMIN_NAME:Admin Officer}
app.security.initial-admin.phone=${ADMIN_PHONE:9876543210}

